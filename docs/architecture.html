<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum App Architecture</title>
<style>
  :root {
    --fg: var(--foreground, #1c2230);
    --dim: var(--muted-foreground, #5b6475);
    --boxfill: var(--card, #ffffff);
    --regionfill: var(--muted, #eceff4);
    --hotc: var(--chart-1, #c2410c);
  }
  figure { margin: 0; }
  svg { display: block; width: 100%; height: auto; color: var(--fg); }
  figcaption { color: var(--dim); font-size: 13px; line-height: 1.55; margin-top: 10px; }

  svg text { font-family: var(--font-sans, system-ui, sans-serif); fill: currentColor; }
  svg .t { font-size: 14px; font-weight: 600; }
  svg .h { font-size: 16px; font-weight: 700; }
  svg .s { font-size: 12px; fill: var(--dim); }
  svg .m { font-size: 11.5px; font-family: var(--font-mono, ui-monospace, monospace); fill: var(--dim); }
  svg .lbl { font-size: 12px; fill: var(--dim); }
  svg .item { font-size: 13px; }
  svg .box { fill: var(--boxfill); stroke: currentColor; stroke-width: 1.2; }
  svg .outer { fill: none; stroke: currentColor; stroke-width: 1.6; }
  svg .region { fill: var(--regionfill); stroke: var(--dim); stroke-width: 1; stroke-dasharray: 5 4; }
  svg .ln { fill: none; stroke: currentColor; stroke-width: 1.4; }
  svg .hot { fill: none; stroke: var(--hotc); stroke-width: 2.6; }
  svg .hotbox { fill: var(--boxfill); stroke: var(--hotc); stroke-width: 2; }
  svg .hotlbl { font-size: 12px; fill: var(--hotc); font-weight: 600; }
  svg .hottxt { font-size: 14px; fill: var(--hotc); font-weight: 700; }
  svg .mk path { fill: currentColor; }
  svg .mkhot path { fill: var(--hotc); }
</style>
</head>
<body>
<figure>
  <svg viewBox="0 0 720 712" role="img" aria-label="The e-drum sends MIDI over USB into a C++ audio engine. Inside one real-time audio callback, hits go to the sfizz drum sampler and mixer and out to the headphones, in about 5 to 11 ms. The same hits are scored against the bar and recorded. A transport drives the metronome and groove playback into the mixer. The Electron UI talks to the engine over a local WebSocket and is not in the sound path.">
    <defs>
      <marker id="arr" class="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="arrhot" class="mkhot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    </defs>

    <!-- top row: hardware -->
    <rect class="hotbox" x="40" y="8" width="190" height="58" rx="8"/>
    <text class="t" x="135" y="33" text-anchor="middle">e-drum</text>
    <text class="s" x="135" y="52" text-anchor="middle">pads → MIDI notes</text>

    <rect class="hotbox" x="490" y="8" width="190" height="58" rx="8"/>
    <text class="t" x="585" y="33" text-anchor="middle">Headphones</text>
    <text class="s" x="585" y="52" text-anchor="middle">PC audio jack</text>

    <text class="hottxt" x="360" y="34" text-anchor="middle">pad → ear ≈ 5–11 ms</text>
    <text class="s" x="360" y="52" text-anchor="middle">round trip through the engine</text>

    <!-- engine -->
    <rect class="outer" x="16" y="100" width="688" height="370" rx="10"/>
    <text class="h" x="360" y="127" text-anchor="middle">C++ audio engine</text>
    <text class="s" x="360" y="145" text-anchor="middle">separate process · real-time priority</text>

    <rect class="region" x="28" y="158" width="664" height="300" rx="8"/>
    <text class="m" x="360" y="179" text-anchor="middle">one audio callback · PipeWire (JACK API) · 64–128 samples</text>

    <!-- row 1: sound path -->
    <rect class="hotbox" x="40" y="196" width="190" height="56" rx="6"/>
    <text class="t" x="135" y="220" text-anchor="middle">MIDI in</text>
    <text class="s" x="135" y="239" text-anchor="middle">stamped on audio clock</text>

    <rect class="hotbox" x="265" y="196" width="190" height="56" rx="6"/>
    <text class="t" x="360" y="220" text-anchor="middle">Drum sampler</text>
    <text class="s" x="360" y="239" text-anchor="middle">sfizz · SFZ kit</text>

    <rect class="hotbox" x="490" y="196" width="190" height="56" rx="6"/>
    <text class="t" x="585" y="220" text-anchor="middle">Mixer</text>
    <text class="s" x="585" y="239" text-anchor="middle">kit + click + groove</text>

    <!-- row 2 -->
    <rect class="box" x="40" y="290" width="190" height="56" rx="6"/>
    <text class="t" x="135" y="314" text-anchor="middle">Scoring</text>
    <text class="s" x="135" y="333" text-anchor="middle">hit vs bar · error in ms</text>

    <rect class="box" x="265" y="290" width="190" height="56" rx="6"/>
    <text class="t" x="360" y="314" text-anchor="middle">Recording</text>
    <text class="s" x="360" y="333" text-anchor="middle">.mid + optional .wav</text>

    <!-- row 3 -->
    <rect class="box" x="40" y="384" width="190" height="56" rx="6"/>
    <text class="t" x="135" y="408" text-anchor="middle">Transport</text>
    <text class="s" x="135" y="427" text-anchor="middle">tempo · loop · count-in</text>

    <rect class="box" x="265" y="384" width="190" height="56" rx="6"/>
    <text class="t" x="360" y="408" text-anchor="middle">Metronome + groove</text>
    <text class="s" x="360" y="427" text-anchor="middle">sample-exact playback</text>

    <!-- sound path arrows -->
    <line class="hot" x1="135" y1="66" x2="135" y2="192" marker-end="url(#arrhot)"/>
    <text class="hotlbl" x="144" y="88">USB MIDI</text>
    <line class="hot" x1="230" y1="224" x2="261" y2="224" marker-end="url(#arrhot)"/>
    <text class="hotlbl" x="247" y="215" text-anchor="middle">hit</text>
    <line class="hot" x1="455" y1="224" x2="486" y2="224" marker-end="url(#arrhot)"/>
    <text class="hotlbl" x="472" y="215" text-anchor="middle">audio</text>
    <line class="hot" x1="585" y1="196" x2="585" y2="70" marker-end="url(#arrhot)"/>
    <text class="hotlbl" x="594" y="88">audio out</text>

    <!-- data and control inside the engine -->
    <line class="ln" x1="135" y1="252" x2="135" y2="287" marker-end="url(#arr)"/>
    <text class="lbl" x="144" y="275">hits</text>
    <line class="ln" x1="230" y1="318" x2="262" y2="318" marker-end="url(#arr)"/>
    <text class="lbl" x="247" y="310" text-anchor="middle">hits</text>
    <line class="ln" x1="135" y1="384" x2="135" y2="349" marker-end="url(#arr)"/>
    <text class="lbl" x="144" y="370">position</text>
    <line class="ln" x1="230" y1="412" x2="262" y2="412" marker-end="url(#arr)"/>
    <text class="lbl" x="247" y="404" text-anchor="middle">beat</text>
    <path class="ln" d="M455 412 H585 V255" marker-end="url(#arr)"/>
    <text class="lbl" x="594" y="340">click + groove</text>

    <!-- engine <-> UI -->
    <line class="ln" x1="310" y1="470" x2="310" y2="549" marker-end="url(#arr)"/>
    <text class="lbl" x="300" y="514" text-anchor="end">hits · timing errors · playhead</text>
    <line class="ln" x1="410" y1="552" x2="410" y2="473" marker-end="url(#arr)"/>
    <text class="lbl" x="420" y="514">tempo · play/stop · kit · mixer</text>
    <text class="m" x="360" y="508" text-anchor="middle">WebSocket</text>
    <text class="m" x="360" y="523" text-anchor="middle">localhost</text>

    <!-- UI -->
    <rect class="outer" x="150" y="552" width="420" height="120" rx="10"/>
    <text class="h" x="170" y="579">Electron UI</text>
    <text class="s" x="170" y="597">TypeScript · not in the sound path</text>
    <text class="item" x="170" y="621">• Bar notation (VexFlow) + moving playhead</text>
    <text class="item" x="170" y="641">• Your hits drawn on the bar, coloured by timing</text>
    <text class="item" x="170" y="661">• Tempo, loop, kit and mixer controls</text>

    <!-- legend -->
    <line class="hot" x1="150" y1="698" x2="182" y2="698"/>
    <text class="lbl" x="190" y="702">sound path (latency-critical)</text>
    <line class="ln" x1="390" y1="698" x2="422" y2="698"/>
    <text class="lbl" x="430" y="702">data and control</text>
  </svg>
  <figcaption>Your hit travels the highlighted path entirely inside the engine's audio callback, so the sound reaches your ears in about 5–11 ms. The same timestamped hit is scored and recorded on the metronome's clock, so timing errors are sample-accurate. The UI only receives results and sends commands; if it lags a few ms on screen, you never hear it.</figcaption>
</figure>
</body>
</html>
